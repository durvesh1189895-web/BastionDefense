name: Build Debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'artifacts/bastion-defense-ui/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: artifacts/bastion-defense-ui
        run: npm install --no-audit --no-fund

      - name: Build web app
        working-directory: artifacts/bastion-defense-ui
        env:
          CAPACITOR_BUILD: "true"
        run: npx vite build --config vite.config.ts

      - name: Add Android platform
        working-directory: artifacts/bastion-defense-ui
        run: npx cap add android || true

      - name: Sync Capacitor
        working-directory: artifacts/bastion-defense-ui
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: artifacts/bastion-defense-ui/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bastion-defense-debug
          path: artifacts/bastion-defense-ui/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
